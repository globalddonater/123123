name: Build opaihook

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2.0.0

    - name: Build Solution
      run: msbuild opaihook.sln /p:Configuration=Release /p:Platform="x64"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: opaihook-release
        path: |
          x64/Release/*.dll
          Release/*.dll
